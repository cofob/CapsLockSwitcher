name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          xcodebuild -project CapsLockSwitcher.xcodeproj -scheme CapsLockSwitcher \
            -configuration Release -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO build
      - name: Verify and package
        run: |
          app="build/Build/Products/Release/CapsLockSwitcher.app"
          test -x "$app/Contents/MacOS/CapsLockSwitcher"
          lipo "$app/Contents/MacOS/CapsLockSwitcher" -verify_arch arm64
          lipo "$app/Contents/MacOS/CapsLockSwitcher" -verify_arch x86_64
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > build/entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          data = Path("build/entitlements.plist").read_bytes()
          entitlements = plistlib.loads(data) if data.strip() else {}
          assert not entitlements.get("com.apple.security.app-sandbox", False), "Accessibility requests require an unsandboxed app"
          info = plistlib.loads(Path("build/Build/Products/Release/CapsLockSwitcher.app/Contents/Info.plist").read_bytes())
          assert info["CFBundleShortVersionString"] == "1.2.1"
          assert info["LSMinimumSystemVersion"] == "15.2"
          PY
          ditto -c -k --keepParent "$app" CapsLockSwitcher.app.zip
          shasum -a 256 CapsLockSwitcher.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: capslockswitcher-release
          path: CapsLockSwitcher.app.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capslockswitcher-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" CapsLockSwitcher.app.zip
          --verify-tag --title "CapsLockSwitcher $RELEASE_TAG"
          --notes "Automatically request Accessibility access on first launch using the native macOS prompt. Enable the app in System Settings, then select two layouts. Universal Intel and Apple Silicon build; macOS 15.2 or later."
